version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]   # majors stay individual, on purpose
    # Playwright is PINNED TO THE CI CONTAINER, so it must not move on its own.
    # The gate runs in mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    # and package.json pins @playwright/test to 1.64.1 to match that image's
    # bundled browsers. A Dependabot bump of the npm package alone leaves the
    # container one version behind the test runner, which is a mismatch the gate
    # cannot report as such. Playwright moves only in a deliberate change that
    # bumps the image tag (v1.64.1), its @sha256 digest and this pin together.
    #
    # @axe-core/playwright is deliberately NOT ignored: it tracks axe-core, not the
    # browser build, and nothing about it is pinned to the image.
    ignore:
      - dependency-name: "@playwright/test"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
