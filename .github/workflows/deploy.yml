name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:            # the gate must judge PRs too
    branches: [main]
  workflow_dispatch:       # so a deploy can be re-run by hand, and so the
                           # post-auto-merge dispatch below has something to call

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress a PR run would cancel a live
  # main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 360 minutes, which is where a six-hour
    # hung job comes from. This suite runs in ~2 minutes; 15 is generous.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Gate on the WHOLE suite, not just the a11y half. A repo whose deploy
      # runs `test:a11y` alone can publish a build whose cryptography is broken
      # so long as the browser specs pass.
      - name: Unit and correctness suites (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # `playwright test` runs EVERY spec despite the script's name: the axe
      # WCAG gate, the claims suite, and the functional flows in four browsers.
      - name: Accessibility gate (axe-core, WCAG A/AA), claims, visual and flows
        run: npm run test:a11y

      # Visual snapshots are baselined for linux from the Playwright container; if
      # this runner ever renders differently the diff images are the only way to
      # tell a real regression from a rendering difference, so keep them.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # NOT `== 'push'`. That also skips workflow_dispatch, which is the one
    # trigger the post-auto-merge dispatch depends on: the dispatched run would
    # build, pass the gate, and skip the deploy job, so the site would never
    # update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    needs: build            # every gate job -- this is what makes it safe
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, pull-requests: write, actions: write }
    # actions: write is required for the deploy dispatch below. Without it
    # `gh workflow run` returns HTTP 403 "Resource not accessible by integration",
    # the merged bump never deploys, and a `|| echo` fallback hides it.
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge any bump whose gate went green
        run: |
          for attempt in 1 2 3; do
            gh pr merge --squash --delete-branch "$PR_URL" && merged=1 && break
            sleep 15          # a sibling PR merging first moves main under us
          done
          [ -n "$merged" ] || { echo "::warning::gate passed, merge did not land"; exit 0; }
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed. See §6.2.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
